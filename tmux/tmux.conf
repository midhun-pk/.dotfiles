# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Indexes
set -g base-index 1
setw -g pane-base-index 1

# Defaul shell
set-option -g default-command "/bin/zsh"

# Truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# automatically renumber tmux windows
set -g renumber-windows on

# prevent accidental exit from session
bind-key -n C-d detach

# Display popup
bind-key G display-popup -d '#{pane_current_path}' -w 90% -h 90% zsh

# Display quick notes
bind-key N display-popup -E "nvim ~/Documents/quick-note.md"

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Activity Monitoring
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# don't rename windows automatically
set-option -g allow-rename off

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf

# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins
set -g @tpm_plugins '
    tmux-plugins/tpm \
    tmux-plugins/tmux-sensible \
    tmux-plugins/tmux-online-status \
    tmux-plugins/tmux-battery \
    omerxx/tmux-sessionx \
'
source-file ~/.config/tmux/themes/tmux-kanagawa-dark.conf

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Configure Tmux
set -g status-position bottom

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# TPM (XDG path)
run '~/.config/tmux/plugins/tpm/tpm'

