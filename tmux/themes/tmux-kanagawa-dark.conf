## COLORSCHEME: kanagawa dark 
# taken from gruvbox and changed toLmy needs: https://github.com/egel/tmux-gruvbox/blob/main/tmux-gruvbox-dark.conf

set-option -g status "on"

# Custom colors
sumilnk="#2A2A37"
oldWhite="#C8C093"
oldWhite2="#A6A69C"
winterYellow="#363646"
winterYellow2="#404055"
katanaGray="#717C7C"
katanaGray2="#717C7C"

bar_bg=$sumilnk

session_bg=$bar_bg
session_fg=$oldWhite

window_active_bg=$katanaGray
window_active_fg=$bar_bg
window_inactive_bg=$winterYellow
window_inactive_fg=$oldWhite2

date_bg=$winterYellow
date_fg=$oldWhite2

time_bg=$winterYellow2
time_fg=$oldWhite2

# default statusbar color
set-option -g status-style bg=$bar_bg,fg=colour223 # bg=bg1, fg=fg1

# default window title colors
set-window-option -g window-status-style bg=colour214,fg=$bar_bg # bg=yellow, fg=bg1

# default window with an activity alert
set-window-option -g window-status-activity-style bg=$bar_bg,fg=colour248 # bg=bg1, fg=fg3

# active window title colors
set-window-option -g window-status-current-style bg=red,fg=$bar_bg # fg=bg1

# pane border
set-option -g pane-active-border-style fg=colour250 #fg2
set-option -g pane-border-style fg=$bar_bg #bg1

# message infos
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# pane number display
set-option -g display-panes-active-colour colour250 #fg2
set-option -g display-panes-colour $bar_bg #bg1

# clock
# set-window-option -g clock-mode-colour colour109 #blue

# bell
# set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

# Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=${session_bg},fg=${session_fg},bold] #S #[bg=${session_bg},fg=${time_bg},nobold,noitalics,nounderscore]"
set-option -g status-right "#[bg=${bar_bg},fg=${date_bg} nobold, nounderscore, noitalics]#[bg=${date_bg},fg=${date_fg}] %Y-%m-%d #[bg=${date_bg},fg=${time_bg},nobold,noitalics,nounderscore]#[bg=${time_bg},fg=${time_fg}] %H:%M "

set-window-option -g window-status-current-format "#[bg=${window_active_bg},fg=${window_active_fg},nobold,noitalics,nounderscore]#[bg=${window_active_bg},fg=${window_active_fg}] #I #[bg=${window_active_bg},fg=${window_active_fg},bold] #W#{?window_zoomed_flag,*Z,} #[bg=${bar_bg},fg=${window_active_bg},nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=${window_inactive_bg},fg=${bar_bg},noitalics]#[bg=${window_inactive_bg},fg=${window_inactive_fg}] #I #[fg=${bar_bg}]#[bg=${window_inactive_bg},fg=${window_inactive_fg}] #W #[bg=${bar_bg},fg=${window_inactive_bg},noitalics]"
